<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub UI構成管理</title>
  <link rel="stylesheet" href="./css/theme.css">
  <style>
    .page-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .page-header h1 {
      margin: 0;
      font-size: 24px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .message {
      display: none;
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 6px;
      white-space: pre-wrap;
    }

    .message.success {
      display: block;
      background: #eef8f0;
      border: 1px solid #9cccaa;
    }

    .message.error {
      display: block;
      background: #fff1f1;
      border: 1px solid #e0a0a0;
    }

    .table-wrapper {
      overflow-x: auto;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th, td {
      padding: 11px 12px;
      border-bottom: 1px solid #e5e5e5;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #f5f5f5;
      font-weight: 600;
      white-space: nowrap;
    }

    tbody tr:hover {
      background: #fafafa;
    }

    .col-order {
      width: 90px;
      text-align: right;
    }

    .col-enabled {
      width: 90px;
      text-align: center;
    }

    .col-actions {
      width: 160px;
      white-space: nowrap;
    }

    .empty-row {
      text-align: center;
      color: #666;
      padding: 30px;
    }

    button {
      cursor: pointer;
    }

    .btn {
      min-height: 36px;
      padding: 7px 14px;
      border: 1px solid #999;
      border-radius: 5px;
      background: #fff;
    }

    .btn-primary {
      background: #1a73e8;
      border-color: #1a73e8;
      color: #fff;
    }

    .btn-danger {
      border-color: #c62828;
      color: #c62828;
    }

    .btn-small {
      min-height: 32px;
      padding: 5px 10px;
    }

    .status-enabled {
      font-weight: 600;
    }

    .status-disabled {
      color: #777;
    }
  </style>
</head>
<body>
  <div id="common-toolbar"></div>

  <main class="page-container">
    <div class="page-header">
      <h1>GitHub UI構成管理</h1>
      <div class="toolbar">
        <button id="reloadButton" class="btn" type="button">再読込</button>
        <button id="addButton" class="btn btn-primary" type="button">追加</button>
      </div>
    </div>

    <div id="message" class="message" role="alert"></div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th class="col-order">表示順</th>
            <th>階層名</th>
            <th>パス</th>
            <th>対象拡張子</th>
            <th class="col-enabled">有効</th>
            <th class="col-actions">操作</th>
          </tr>
        </thead>
        <tbody id="structureTableBody">
          <tr>
            <td colspan="6" class="empty-row">読込中です。</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script type="module" src="./js/github_ui_structure_maintenance.js"></script>
</body>
</html>
