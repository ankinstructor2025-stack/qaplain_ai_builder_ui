<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リポジトリ編集 - QA+Plain AI Builder</title>
    <link rel="stylesheet" href="./css/theme.css">
</head>
<body>

<main class="page">

    <div class="page-toolbar">
        <div class="page-toolbar-title">リポジトリ編集</div>
        <div class="page-toolbar-main"></div>

        <div class="page-toolbar-actions">
            <button id="testButton" class="btn btn-primary" type="button">
                通信確認
            </button>

            <button id="saveButton" class="btn btn-primary" type="button">
                保存
            </button>

            <button id="backButton" class="btn" type="button">
                戻る
            </button>
        </div>
    </div>

    <section class="card">
        <div class="form-grid">

            <div class="form-row">
                <label for="repositoryName">名前</label>
                <input
                    id="repositoryName"
                    class="input"
                    type="text"
                    maxlength="100"
                    placeholder="例: QA+Plain AI Builder">
            </div>

            <div class="form-row">
                <label for="uiRepositoryUrl">UI用リポジトリURL</label>
                <input
                    id="uiRepositoryUrl"
                    class="input"
                    type="url"
                    maxlength="500"
                    placeholder="https://github.com/所有者/UIリポジトリ">
            </div>

            <div class="form-row">
                <label>UI通信状態</label>
                <div id="uiConnectionStatus">未確認</div>
            </div>

            <div class="form-row">
                <label for="apiRepositoryUrl">API用リポジトリURL</label>
                <input
                    id="apiRepositoryUrl"
                    class="input"
                    type="url"
                    maxlength="500"
                    placeholder="https://github.com/所有者/APIリポジトリ">
            </div>

            <div class="form-row">
                <label>API通信状態</label>
                <div id="apiConnectionStatus">未確認</div>
            </div>

            <div class="form-row">
                <label for="githubToken">GitHub Personal Access Token</label>
                <input
                    id="githubToken"
                    class="input"
                    type="password"
                    autocomplete="new-password"
                    placeholder="変更しない場合は空欄">
            </div>

        </div>
    </section>

</main>

<script type="module" src="./js/repository_edit.js"></script>
</body>
</html>
