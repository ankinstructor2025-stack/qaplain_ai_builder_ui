<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub API構成編集</title>
<link rel="stylesheet" href="./css/theme.css">
</head><body>
<main class="page">
<div class="page-toolbar">
<div class="page-toolbar-title">GitHub API構成編集</div>
<div class="page-toolbar-main"></div>
<div class="page-toolbar-actions">
<button id="saveButton" class="btn btn-primary" type="button">保存</button>
<button id="backButton" class="btn" type="button">戻る</button>
</div></div>
<section class="card"><div class="form-grid">
<div class="form-row">
<label for="directoryPath">GitHub上のパス</label>
<input id="directoryPath" class="input" type="text" maxlength="500">
</div>
<div class="form-row">
<label for="extensions">対象拡張子</label>
<input id="extensions" class="input" type="text" maxlength="300" placeholder=".js,.html">
</div>
</div></section>
</main>
<script type="module" src="./js/github_api_structure_edit.js"></script>
</body></html>
