<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>機能メニュー - QA+Plain AI Builder</title>

    <link rel="stylesheet" href="./css/theme.css">
</head>

<body>

<div class="center-wrap">
    <div class="card menu-card">
        <div class="menu-shell">

            <div class="menu-header">
                <div class="menu-title">
                    <h2>機能メニュー</h2>
                    <div class="subtitle">
                        使用する機能を選択してください
                    </div>
                </div>

                <button
                    id="btn-logout"
                    class="btn logout-btn"
                    type="button">
                    ログアウト
                </button>
            </div>

            <div class="menu-list">

                <div class="menu-row">
                    <button
                        id="btn-repository"
                        class="btn btn-primary menu-btn"
                        type="button">
                        リポジトリ管理
                    </button>

                    <div class="menu-text">
                        GitHubのUI用・API用リポジトリを設定し、
                        接続できることを確認します。
                    </div>
                </div>

                <div class="menu-row">
                    <button
                        id="btn-github-ui-structure"
                        class="btn btn-primary menu-btn"
                        type="button">
                        GitHub UI構成管理
                    </button>

                    <div class="menu-text">
                        UIリポジトリの管理対象ディレクトリを管理します。
                    </div>
                </div>

                <div class="menu-row">
                    <button
                        id="btn-github-api-structure"
                        class="btn btn-primary menu-btn"
                        type="button">
                        GitHub API構成管理
                    </button>

                    <div class="menu-text">
                        APIリポジトリの管理対象ディレクトリを管理します。
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script
    type="module"
    src="./js/menu.js">
</script>

</body>
</html>
